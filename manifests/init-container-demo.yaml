apiVersion: v1
kind: Pod

metadata:
  name: init-demo
  labels:
    app: init-demo

spec:
  initContainers:
    - name: setup
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Prepared by init container' > /shared-data/message.txt"]
      volumeMounts:
        - name: shared-data
          mountPath: /shared-data

  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "cat /shared-data/message.txt && sleep 3600"]
      volumeMounts:
        - name: shared-data
          mountPath: /shared-data

  volumes:
    - name: shared-data
      emptyDir: {}
