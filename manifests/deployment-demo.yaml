apiVersion: apps/v1
kind: Deployment

metadata:
  name: deploy-demo

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: deploy-demo

  template:
    metadata:
      labels:
        app: deploy-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.25
