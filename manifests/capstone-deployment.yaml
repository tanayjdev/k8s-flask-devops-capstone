apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask
          image: tanayjain29/flask-devops-app:sha-a8f36ea
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: flask-app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: flask-app-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flask-app-secret
                  key: DB_PASSWORD
