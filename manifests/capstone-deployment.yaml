apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      serviceAccountName: flask-app-sa
      automountServiceAccountToken: false
      containers:
        - name: flask
          image: tanayjain29/flask-devops-app:sha-a8f36ea
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: flask-app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: flask-app-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flask-app-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 10
            failureThreshold: 3
