apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-cronjob
  namespace: rbac-lab
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: busybox:1.36
              command:
                - sh
                - -c
                - echo "CronJob execution at $(date)" && sleep 90
