apiVersion: batch/v1
kind: Job
metadata:
  name: job-multicompletion
  namespace: rbac-lab
spec:
  completions: 4
  parallelism: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3 && echo done"]
