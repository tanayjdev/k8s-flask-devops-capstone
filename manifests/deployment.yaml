apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 3
            failureThreshold: 4

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2

          envFrom:
            - configMapRef:
                name: web-app-config

          env:
            - name: GREETING_EXPLICIT
              valueFrom:
                configMapKeyRef:
                  name: web-app-config
                  key: GREETING

            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: web-app-secret
                  key: DEMO_TOKEN

          volumeMounts:
            - name: config-volume
              mountPath: /etc/config

      volumes:
        - name: config-volume
          configMap:
            name: web-app-config
