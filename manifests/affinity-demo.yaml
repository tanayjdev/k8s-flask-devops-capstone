apiVersion: v1
kind: Pod
metadata:
  name: affinity-demo
  labels:
    app: affinity-demo
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: disktype
                operator: In
                values:
                  - ssd
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: affinity-demo
          topologyKey: kubernetes.io/hostname
  containers:
    - name: nginx
      image: nginx:1.25
