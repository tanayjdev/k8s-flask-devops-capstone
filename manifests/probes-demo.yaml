apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo
  labels:
    app: liveness-demo
spec:
  restartPolicy: Always
  containers:
    - name: nginx
      image: nginx:1.25
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 3
        failureThreshold: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: slow-start-fixed
  labels:
    app: slow-start-fixed
spec:
  restartPolicy: Always
  containers:
    - name: nginx
      image: nginx:1.25
      command:
        - sh
        - -c
        - sleep 20 && nginx -g 'daemon off;'
      startupProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 3
        failureThreshold: 10
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 3
        failureThreshold: 2
