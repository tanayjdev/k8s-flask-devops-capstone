apiVersion: v1
kind: Pod
metadata:
  name: emptydir-lifecycle-demo
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo 'written at pod creation' > /data/note.txt && sleep 3600
      volumeMounts:
        - name: scratch
          mountPath: /data
  volumes:
    - name: scratch
      emptyDir: {}
