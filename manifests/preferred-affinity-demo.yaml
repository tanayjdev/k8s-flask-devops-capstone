apiVersion: v1
kind: Pod
metadata:
  name: preferred-affinity-demo
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: totally-nonexistent-label
                operator: In
                values:
                  - yes
  containers:
    - name: nginx
      image: nginx:1.25
